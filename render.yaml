services:
  - type: web
    name: leadflow-manager
    runtime: node
    plan: free
    repo: https://github.com/Anjali140600/lead-manager
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
